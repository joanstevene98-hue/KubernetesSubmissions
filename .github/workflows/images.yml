# Builds every directory that contains a Dockerfile and pushes it to GHCR,
# tagged with the git tag (exercise number), e.g. ghcr.io/<user>/log-output:1.1
name: Build images

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME}"
          for f in $(find . -name Dockerfile -not -path './.git/*'); do
            DIR=$(dirname "$f" | sed 's|^\./||')
            NAME=$(echo "$DIR" | tr '_/' '--')
            IMAGE="ghcr.io/$OWNER/$NAME:$TAG"
            echo "Building $IMAGE from $DIR"
            docker build -t "$IMAGE" "$DIR"
            docker push "$IMAGE"
          done
