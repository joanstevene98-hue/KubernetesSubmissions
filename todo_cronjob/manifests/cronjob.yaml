apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: project
  name: wikipedia-todo
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: wikipedia-todo
              image: ghcr.io/joanstevene98-hue/todo-cronjob:2.9
              env:
                - name: TODO_BACKEND_URL
                  value: http://todo-backend-svc:2345
                - name: RANDOM_ARTICLE_URL
                  value: https://en.wikipedia.org/wiki/Special:Random
